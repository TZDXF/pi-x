name: Release

# 正式版：在 main 分支上创建 vX.Y.Z 形式的 tag 并推送即可触发
#   git tag v0.0.1 origin/main
#   git push origin v0.0.1

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: 校验 tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 校验 tag 基于 main 分支
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::tag $GITHUB_REF_NAME 不在 main 分支上，正式版必须从 main 创建 tag"
            exit 1
          fi

  build:
    name: 构建 (${{ matrix.platform }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 安装 Linux 依赖
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 同步版本号
        run: node scripts/set-version.mjs "${{ needs.prepare.outputs.version }}"

      - name: 构建并发布正式版
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          releaseName: PiX ${{ github.ref_name }}
          updaterJsonPreferNsis: true
          args: --features remote-access --config '{"bundle":{"createUpdaterArtifacts":true}}'

  notes:
    name: 生成发布说明
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 自动生成 Release Notes
        run: gh release edit "${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
