name: Release

# 正式版：在 main 分支上创建 vX.Y.Z 形式的 tag 并推送即可触发
#   git tag v0.0.1 origin/main
#   git push origin v0.0.1

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: 校验 tag 并创建 release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 校验 tag 基于 main 分支
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::tag $GITHUB_REF_NAME 不在 main 分支上，正式版必须从 main 创建 tag"
            exit 1
          fi

      - name: 创建草稿 release
        # 串行创建 release，避免 tauri-action 三平台矩阵并发调用 GitHub API 产生 422 already_exists。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --draft \
            --title "PiX ${{ github.ref_name }}" \
            --notes "Release notes will be generated after all platforms finish building."

  build:
    name: 构建 (${{ matrix.platform }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          # MSI 版本号要求 major <= 255，语义化版本超限；统一用 NSIS 打包规避。
          - platform: windows-latest
            args: --features remote-access --bundles nsis
          - platform: macos-latest
            args: --features remote-access
          - platform: ubuntu-latest
            args: --features remote-access
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 安装 Linux 依赖
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 同步版本号
        run: node scripts/set-version.mjs "${{ needs.prepare.outputs.version }}"

      - name: 构建并发布正式版
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: PiX ${{ github.ref_name }}
          releaseDraft: false
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }} --config '{"bundle":{"createUpdaterArtifacts":true}}'

  notes:
    name: 生成发布说明
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 生成发布说明并转为正式 release
        # 作业内无 git 仓库上下文，所有 gh 调用必须显式指定仓库（-R 或 API 路径）；
        # generate_release_notes=true 对无 PR 的直接推送仓库不生效，改用 generate-notes 接口取回说明后显式写入。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" --jq .id)
          BODY=$(gh api "repos/${{ github.repository }}/releases/generate-notes" -f tag_name="${{ github.ref_name }}" --jq .body)
          gh api -X PATCH "repos/${{ github.repository }}/releases/$RELEASE_ID" -F body="$BODY" --jq .html_url
          gh release edit "${{ github.ref_name }}" --draft=false -R "${{ github.repository }}"
