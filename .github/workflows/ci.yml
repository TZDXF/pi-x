name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:

jobs:
  web:
    name: Frontend (lint / typecheck / build / tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Unit tests (Vitest)
        run: pnpm run test:web:all

  rust:
    name: Rust (${{ matrix.config }} / check / tests)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: default
            args: ""
          - config: remote-access
            args: --features remote-access
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        if: matrix.config == 'remote-access'

      - uses: actions/setup-node@v7
        if: matrix.config == 'remote-access'
        with:
          node-version: 22
          cache: pnpm

      - name: Build embedded frontend
        if: matrix.config == 'remote-access'
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check
        run: cargo check --manifest-path src-tauri/Cargo.toml ${{ matrix.args }}

      - name: Unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml ${{ matrix.args }}

  macos:
    name: macOS (frontend build / Rust check / tests)
    # 独立 macOS 检查：GitHub 托管的 macos runner，不接自托管机器、不跑 E2E、不调用真实模型服务。
    # 目的是在 Darwin 上跑一遍与 Linux 等价的前端构建和默认 Tauri/Rust 检查，
    # 覆盖 cfg(target_os = "macos") 的代码路径（图标提取、终端打开、路径规范化等）。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Darwin 上 `/var` 是指向 `/private/var` 的软链，runner 默认的
      # `TMPDIR=/var/folders/...` 因此不是真实路径。仓库里有一批用例按
      # `realpath` 比较路径（夹具取 `temp_dir()`，被测代码按真实路径归一），
      # 不归一就会失败。这里统一把后续步骤的 TMPDIR 换成真实路径。
      - name: Normalize TMPDIR to its real path
        run: |
          raw="${TMPDIR:-$(getconf DARWIN_USER_TEMP_DIR)}"
          real="$(cd "$raw" && pwd -P)"
          echo "TMPDIR(raw)=$raw"
          echo "TMPDIR(real)=$real"
          echo "TMPDIR=$real" >> "$GITHUB_ENV"

      - name: Build
        run: pnpm run build

      - uses: dtolnay/rust-toolchain@stable

      # macOS runner 自带 Xcode Command Line Tools，Tauri 的 Darwin 依赖无需额外安装。
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: temp/playwright/report
          retention-days: 7
