[package]
name = "pi-x"
version = "0.1.0"
description = "PiX - desktop client for the pi coding agent"
authors = ["pi-x"]
edition = "2021"

[lib]
name = "pi_x_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
remote-access = ["dep:argon2", "dep:rand_core"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cron = "0.15"
chrono = "0.4"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["process", "io-util", "sync", "macros", "rt", "net"] }
axum = { version = "0.8", features = ["ws"] }
mime_guess = "2"
uuid = { version = "1", features = ["v4"] }
if-addrs = "0.14"
dunce = "1"
dirs = "6"
regex = "1.13.1"
ureq = { version = "2", default-features = false, features = ["tls", "native-certs"] }
portable-pty = "0.8"
base64 = "0.22"
notify = "8"
# 编辑器图标提取(image 负责缩放与 PNG 编码;pelite/ico 解析 Windows exe 资源;
# plist/icns 解析 macOS .app 图标)——均为纯 Rust,参考 RepoMeow 的实现
image = { version = "0.25", default-features = false, features = ["png"] }
pelite = "0.10"
ico = "0.5"
icns = "0.4"
plist = "1.10"
argon2 = { version = "0.5.3", optional = true }
rand_core = { version = "0.6", features = ["getrandom"], optional = true }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
