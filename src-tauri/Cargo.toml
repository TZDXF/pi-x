[package]
name = "pi-x"
version = "0.1.0"
description = "PiX - desktop client for the pi coding agent"
authors = ["pi-x"]
edition = "2021"

[lib]
name = "pi_x_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
remote-access = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "macros", "rt", "net"] }
axum = { version = "0.8", features = ["ws"] }
mime_guess = "2"
uuid = { version = "1", features = ["v4"] }
if-addrs = "0.14"
dunce = "1"
dirs = "6"
regex = "1.13.1"
ureq = { version = "2", default-features = false, features = ["tls", "native-certs"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
